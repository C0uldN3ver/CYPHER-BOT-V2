# Nixpacks configuration for Railway deployment
# Docs: https://nixpacks.com/docs/configuration/file

[phases.setup]
# Install system-level dependencies required by discord.py and PyNaCl
# Using aptPkgs for apt-get based installation
aptPkgs = ['...', 'libffi-dev', 'libsodium-dev']

[start]
# Nixpacks automatically uses the Python version from runtime.txt
# The venv python binary is used, so just "python" is correct
cmd = "python main.py"
